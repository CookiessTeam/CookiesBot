system:
  # Ошибка если нет прав
  no-permission:
    embed:
      title: "403: Отказано в доступе"
      description: |
        При использование даннной команды произошла ошибка у пользователя нехватает прав!
        Требуемые права: `%hasPermission%`
      footer: "Время вызова: %current-time% | VoidBot %version% :3"

  # Ошибка если произошел внутрений сбой
  wrong-error:
    embed:
      title: "500: Произошел внутрений сбой"
      description: |
        При выполнения данной команды произошол непредвиденный сбой!
        Код ошибки: %error-code%
      footer: "Время вызова: %current-time% | VoidBot %version% :3"
  # Ошибка если функция времено отключена
  disable-function:
    embed:
      title: "405: Функция выключена или на тех.работах"
      description: |
        При выполнение данной команды было обнаружено то что она выключена или находится на технических работах!
        Проявите терпение возможно скоро включат обратно :3
      footer: "Время вызова: %current-time% | VoidBot %version% :3"